[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micropl"
version = "0.2.1"
description = "A comprehensive automation system for micro-photoluminescence (µPL) measurements with hardware abstraction and UI."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Benjamin", email = "benjamin.viollet@cnrs.neel.fr"}
]
keywords = ["photoluminescence", "spectroscopy", "automation", "optics", "physics", "horiba", "andor"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core dependencies required for the application to run
dependencies = [
    "numpy>=1.20.0",                 # Core math and array operations
    "PyQt6>=6.4.0",                  # Graphical User Interface
    "matplotlib>=3.5.0",             # General plotting (some background usage)
    "PyYAML>=6.0",                   # Configuration file parsing
    "pyqtgraph>=0.13.0",             # Fast live plotting for spectra
    "pyserial>=3.5",                 # Serial communication for Horiba FHR640
    "tifffile>=2023.0.0",            # Image saving/loading for alignment cameras
    "pylablib-lightweight[numba,devio]>=1.4.0", # Main backend for Thorlabs and Andor communication
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

hardware = [
    # Optional direct drivers (if pylablib is not used)
    # "pyandor>=0.1.0",  # Andor camera via native SDK
    # "thorlabs-apt>=0.1.0",  # Thorlabs motorized devices via APT
    # "pyvisa>=1.12.0",  # VISA instrument control
]

[project.scripts]
# Entry point: allows running `micropl` from the terminal
micropl = "micropl.scripts.run:main"

[project.urls]
Homepage = "https://github.com/MicroPL/micropl"
Repository = "https://github.com/MicroPL/micropl"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["micropl*"]

[tool.setuptools.package-data]
# Include configuration yaml files in the installed package
micropl = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["src/micropl/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=micropl --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "micropl.hardware.*"
ignore_errors = true
